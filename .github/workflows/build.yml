# Builds Gabilyrics for Windows and macOS on GitHub's machines.
#
#  • Every push to main / pull request → installers are attached to the run as downloadable "artifacts".
#  • Pushing a version tag (e.g. v1.2.0) → also creates a draft GitHub Release with the installers,
#    using the tag as the app version.
#  • You can also start it by hand: Actions tab → Build → Run workflow.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --win --x64
          - name: macOS
            os: macos-latest
            args: --mac --x64 --arm64   # Intel and Apple Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Use the tag as the version (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build installers
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # No paid code-signing certificate yet: skip signing (macOS gets an ad-hoc signature instead).
          # Add CSC_LINK / CSC_KEY_PASSWORD secrets later to sign properly.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: Gabilyrics-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          draft: true
          generate_release_notes: true
